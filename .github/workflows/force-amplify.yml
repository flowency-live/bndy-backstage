name: Force Backstage Amplify release

on:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

env:
  AWS_REGION: eu-west-2
  AMPLIFY_APP_ID: d3hbhqxqqchzbb
  AMPLIFY_BRANCH: main

jobs:
  release:
    if: contains(github.event.head_commit.message, '[force-amplify]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Mark deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"pending","context":"bndy/amplify-deploy","description":"Building Backstage before Amplify release"}' >/dev/null

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci

      - name: Production build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: Configure AWS credentials
        id: aws_auth
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Start and wait for Amplify release
        id: amplify
        if: steps.aws_auth.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          JOB_ID=$(aws amplify start-job \
            --region "$AWS_REGION" \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH" \
            --job-type RELEASE \
            --query 'jobSummary.jobId' \
            --output text)
          echo "Amplify job: $JOB_ID"

          for i in $(seq 1 90); do
            STATUS=$(aws amplify get-job \
              --region "$AWS_REGION" \
              --app-id "$AMPLIFY_APP_ID" \
              --branch-name "$AMPLIFY_BRANCH" \
              --job-id "$JOB_ID" \
              --query 'job.summary.status' \
              --output text)
            echo "poll=$i status=$STATUS"
            case "$STATUS" in
              SUCCEED) exit 0 ;;
              FAILED|CANCELLED) exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for Amplify job" >&2
          exit 1

      - name: Publish deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          AUTH_OUTCOME: ${{ steps.aws_auth.outcome }}
          AMPLIFY_OUTCOME: ${{ steps.amplify.outcome }}
        shell: bash
        run: |
          if [ "$INSTALL_OUTCOME" != "success" ]; then
            STATE=failure; DESCRIPTION='npm ci failed'
          elif [ "$BUILD_OUTCOME" != "success" ]; then
            STATE=failure; DESCRIPTION='Backstage production build failed'
          elif [ "$AUTH_OUTCOME" != "success" ]; then
            STATE=failure; DESCRIPTION='AWS credentials unavailable to Backstage workflow'
          elif [ "$AMPLIFY_OUTCOME" != "success" ]; then
            STATE=failure; DESCRIPTION='Amplify release failed'
          else
            STATE=success; DESCRIPTION='Backstage released successfully through Amplify'
          fi

          jq -n --arg state "$STATE" --arg description "$DESCRIPTION" \
            '{state:$state,context:"bndy/amplify-deploy",description:$description}' >/tmp/status.json
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/status.json >/dev/null

          test "$STATE" = success
