name: Force Backstage Amplify release

on:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

env:
  AWS_REGION: eu-west-2
  AMPLIFY_APP_ID: d3hbhqxqqchzbb
  AMPLIFY_BRANCH: main

jobs:
  release:
    if: contains(github.event.head_commit.message, '[force-amplify]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Mark deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for CONTEXT in bndy/install bndy/build bndy/aws-auth bndy/amplify-release; do
            jq -n --arg context "$CONTEXT" '{state:"pending",context:$context,description:"Backstage forced release in progress"}' >/tmp/status.json
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              --data-binary @/tmp/status.json >/dev/null
          done

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci

      - name: Production build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/backstage-build.log

      - name: Configure AWS credentials
        id: aws_auth
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Start and wait for Amplify release
        id: amplify
        if: steps.aws_auth.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          JOB_ID=$(aws amplify start-job \
            --region "$AWS_REGION" \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH" \
            --job-type RELEASE \
            --query 'jobSummary.jobId' \
            --output text)
          echo "Amplify job: $JOB_ID"
          for i in $(seq 1 90); do
            STATUS=$(aws amplify get-job \
              --region "$AWS_REGION" \
              --app-id "$AMPLIFY_APP_ID" \
              --branch-name "$AMPLIFY_BRANCH" \
              --job-id "$JOB_ID" \
              --query 'job.summary.status' \
              --output text)
            echo "poll=$i status=$STATUS"
            case "$STATUS" in
              SUCCEED) exit 0 ;;
              FAILED|CANCELLED) exit 1 ;;
            esac
            sleep 10
          done
          exit 1

      - name: Publish deployment stages
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          AUTH_OUTCOME: ${{ steps.aws_auth.outcome }}
          AMPLIFY_OUTCOME: ${{ steps.amplify.outcome }}
        shell: bash
        run: |
          publish() {
            local context="$1" outcome="$2" description="$3"
            local state=failure
            [ "$outcome" = success ] && state=success
            jq -n --arg state "$state" --arg context "$context" --arg description "$description" \
              '{state:$state,context:$context,description:$description}' >/tmp/status.json
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              --data-binary @/tmp/status.json >/dev/null
          }

          publish bndy/install "$INSTALL_OUTCOME" "npm ci: $INSTALL_OUTCOME"
          publish bndy/build "$BUILD_OUTCOME" "production build: $BUILD_OUTCOME"
          publish bndy/aws-auth "$AUTH_OUTCOME" "AWS auth: $AUTH_OUTCOME"
          publish bndy/amplify-release "$AMPLIFY_OUTCOME" "Amplify release: $AMPLIFY_OUTCOME"

          if [ "$BUILD_OUTCOME" != success ] && [ -s /tmp/backstage-build.log ]; then
            ERROR_LINE=$(grep -E "Could not resolve|Failed to resolve|error during build|RollupError|ERROR|Error:" /tmp/backstage-build.log | tail -n 1 || true)
            [ -n "$ERROR_LINE" ] || ERROR_LINE=$(tail -n 8 /tmp/backstage-build.log | head -n 1)
            SAFE=$(printf '%s' "$ERROR_LINE" | tr -cd '[:alnum:] ._:/@()\[\]-' | cut -c1-72)
            [ -n "$SAFE" ] || SAFE='unknown-build-error'
            publish "bndy/build-error/$SAFE" failure "Vite build error"
          fi

          test "$INSTALL_OUTCOME" = success \
            && test "$BUILD_OUTCOME" = success \
            && test "$AUTH_OUTCOME" = success \
            && test "$AMPLIFY_OUTCOME" = success
